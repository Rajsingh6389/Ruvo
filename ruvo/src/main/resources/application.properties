spring.application.name=ruvo

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ruvo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ruvo@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
server.port=8080
server.address=0.0.0.0
app.jwt.secret=ruvo-development-jwt-secret-change-this-to-a-32-byte-production-secret
app.jwt.expiration-ms=86400000
management.endpoints.web.exposure.include=health,info

# Razorpay Configuration (Test Mode)
razorpay.key.id=rzp_test_placeholder
razorpay.key.secret=rzp_secret_placeholder
razorpay.webhook.secret=rzp_webhook_secret_placeholder

# Cashfree Configuration (Test Mode)
cashfree.app.id=cf_test_app_id_placeholder
cashfree.client.secret=cf_test_secret_placeholder
cashfree.api.version=2023-08-01
cashfree.base.url=https://sandbox.cashfree.com/pg


