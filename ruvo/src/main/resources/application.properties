spring.application.name=ruvo

# =========================
# MYSQL - LOCAL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/ruvo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=raj@9125
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================
# SERVER
# =========================
server.port=8080
server.address=0.0.0.0

# =========================
# MULTIPART FILE UPLOAD
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =========================
# JWT - LOCAL
# =========================
app.jwt.secret=ruvo-local-development-secret-change-later
app.jwt.expiration-ms=86400000

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info

# =========================
# RUVO SETTLEMENT
# =========================
ruvo.settlement.expose-otp=true
ruvo.commission.cycle-days=2
ruvo.commission.grace-period-hours=48

# =========================
# CASHFREE - SANDBOX
# =========================
cashfree.api.version=2023-08-01
cashfree.base.url=https://sandbox.cashfree.com/pg


# Set via environment variables or replace with actual values:
# cashfree.app.id=your_cashfree_app_id
# cashfree.client.secret=your_cashfree_client_secret
cashfree.app.id=${CASHFREE_CLIENT_ID:}
cashfree.client.secret=${CASHFREE_CLIENT_SECRET:}
cashfree.return.url=http://localhost:8080/api/payments/cashfree/return
cashfree.webhook.url=http://localhost:8080/api/payments/cashfree/webhook

# =========================
# CLOUDINARY - LOCAL & CLOUD
